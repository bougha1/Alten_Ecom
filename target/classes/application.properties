spring.datasource.url=jdbc:h2:mem:Eco;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework=DEBUG
logging.level.org.springframework.security=DEBUG


# JWT Secret Key (Changez-le par une clé sécurisée)
jwt.secret=LongSecureRandomSecretKeyForHS256123456789

product.images.directory=src/main/resources/static/images

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
spring.data.web.sort.default-property=name
